server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Internal tool — keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
